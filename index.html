<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSTROY — Строительство и Ремонт</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --btn-beige: #dfc49f; 
            --btn-beige-hover: #eadaaf; 
            --text-dark: #1a1a1a; 
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: #000; color: #fff; line-height: 1.6; overflow-x: hidden; }

        /* ========================================================= */
        /* ШАПКА                                                    */
        /* ========================================================= */
        header { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            background: rgba(0, 0, 0, 0.85); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        .header-container { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 18px 0; 
        }

        .logo-text { 
            font-size: 28px; 
            font-weight: 700; 
            color: var(--btn-beige); 
            text-transform: uppercase; 
            text-decoration: none; 
            letter-spacing: 4px; 
        }

        .header-right { 
            display: flex; 
            align-items: center; 
            gap: 25px; 
        }

        /* Навигация для ПК */
        nav.desktop-nav {
            display: flex;
            gap: 12px;
        }

        nav.desktop-nav a { 
            color: #ffffff; 
            text-decoration: none; 
            font-size: 11px; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            padding: 10px 22px; 
            border-radius: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.25); 
            background: transparent;
            transition: var(--transition); 
            display: inline-block;
        }

        nav.desktop-nav a:hover, nav.desktop-nav a.active { 
            color: #1a1a1a; 
            background: var(--btn-beige); 
            border-color: var(--btn-beige); 
            box-shadow: 0 4px 18px rgba(223, 196, 159, 0.35);
        }

        .header-phone { 
            color: #fff; 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 14px; 
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .header-phone:hover { color: var(--btn-beige); }

        /* Иконка меню для смартфона */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--btn-beige);
            font-size: 22px;
            cursor: pointer;
            padding: 5px;
        }

        /* Мобильное выпадающее меню */
        .mobile-nav-overlay {
            display: none;
            position: fixed;
            top: 65px;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.98);
            border-bottom: 1px solid rgba(223, 196, 159, 0.2);
            padding: 25px 20px;
            flex-direction: column;
            gap: 15px;
            z-index: 999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .mobile-nav-overlay.open { display: flex; }

        .mobile-nav-overlay a {
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 12px 20px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .mobile-nav-overlay a:active {
            background: var(--btn-beige);
            color: #000;
        }

        /* ========================================================= */
        /* ГЛАВНЫЙ ЭКРАН (ФОН С ЗАГОРОДНЫМ ДОМОМ)                    */
        /* ========================================================= */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 20px 60px;
            /* Указан фон первого фото (b-3.jpg) и легкая прозрачность */
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('b-3.jpg') center/cover no-repeat;
        }

        .hero-content {
            max-width: 850px;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 56px;
            font-weight: 600;
            line-height: 1.15;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
        }

        .hero-title span {
            font-style: italic;
            font-weight: 400;
            color: var(--btn-beige);
        }

        .hero-subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 40px;
            font-weight: 300;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        .hero-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .btn-main {
            display: inline-block;
            padding: 18px 38px;
            background: var(--btn-beige);
            color: #1a1a1a;
            text-decoration: none;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: var(--transition);
            border-radius: 2px;
            border: 1px solid var(--btn-beige);
        }

        .btn-main:hover {
            background: var(--btn-beige-hover);
            border-color: var(--btn-beige-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(223, 196, 159, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: #fff;
            border-color: rgba(255, 255, 255, 0.4);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #fff;
            color: #fff;
        }

        /* ========================================================= */
        /* АДАПТИВНОСТЬ                                             */
        /* ========================================================= */
        @media (max-width: 992px) {
            nav.desktop-nav { display: none; }
            .mobile-menu-btn { display: block; }
            .hero-title { font-size: 38px; }
            .hero-subtitle { font-size: 15px; }
            .logo-text { font-size: 22px; letter-spacing: 2px; }
            .header-phone { font-size: 12px; }
        }

        @media (max-width: 576px) {
            .hero-buttons { flex-direction: column; width: 100%; }
            .btn-main { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- ШАПКА -->
    <header>
        <div class="container">
            <div class="header-container">
                <a href="index.html" class="logo-text">INSTROY</a>
                
                <div class="header-right">
                    <!-- ПК Навигация -->
                    <nav class="desktop-nav">
                        <a href="services.html">Услуги</a>
                        <a href="anketa.html">Анкета</a>
                        <a href="contacts.html">Контакты</a>
                    </nav>

                    <a href="tel:+79199282678" class="header-phone">8 (919) 928-26-78</a>

                    <!-- Кнопка мобильного меню -->
                    <button class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Открыть меню">
                        <i class="fa-solid fa-bars" id="menu-icon"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Мобильное выпадающее меню -->
    <div class="mobile-nav-overlay" id="mobileNav">
        <a href="services.html">Услуги</a>
        <a href="anketa.html">Анкета</a>
        <a href="contacts.html">Контакты</a>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <main>
        <section class="hero">
            <div class="hero-content">
                <h1 class="hero-title">Строительство <span>&</span> Ремонт</h1>
                <p class="hero-subtitle">
                    Создаем современные интерьеры премиум-класса с гарантией качества на каждом этапе
                </p>
                <div class="hero-buttons">
                    <a href="services.html" class="btn-main">Смотреть пакеты услуг</a>
                    <a href="anketa.html" class="btn-main btn-secondary">Рассчитать стоимость</a>
                </div>
            </div>
        </section>
    </main>

    <script>
        function toggleMobileMenu() {
            const nav = document.getElementById('mobileNav');
            const icon = document.getElementById('menu-icon');
            
            nav.classList.toggle('open');
            
            if (nav.classList.contains('open')) {
                icon.className = 'fa-solid fa-xmark';
            } else {
                icon.className = 'fa-solid fa-bars';
            }
        }
    </script>
</body>
</html>
