<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты — INSTROY</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --btn-beige: #dfc49f; 
            --btn-beige-hover: #eadaaf; 
            --text-dark: #1a1a1a; 
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { color: var(--text-dark); background: #fff; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* ========================================================= */
        /* ЕДИНАЯ ШАПКА ДЛЯ ВСЕХ СТРАНИЦ                              */
        /* ========================================================= */
        header { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            background: rgba(0, 0, 0, 0.9); 
            backdrop-filter: blur(10px); 
            z-index: 1000; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header-container { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 16px 0; 
        }

        .logo-text { 
            font-size: 32px; 
            font-weight: 700; 
            color: var(--btn-beige); 
            text-transform: uppercase; 
            text-decoration: none; 
            letter-spacing: 4px; 
        }

        .header-right { 
            display: flex; 
            align-items: center; 
            gap: 25px; 
        }

        nav {
            display: flex;
            gap: 12px;
        }

        nav a { 
            color: #ffffff; 
            text-decoration: none; 
            font-size: 11px; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            padding: 10px 24px; 
            border-radius: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.25); 
            background: transparent;
            transition: var(--transition); 
            display: inline-block;
        }

        nav a:hover { 
            color: #1a1a1a; 
            background: var(--btn-beige); 
            border-color: var(--btn-beige); 
            box-shadow: 0 4px 18px rgba(223, 196, 159, 0.35);
            transform: translateY(-2px);
        }

        nav a.active { 
            color: #1a1a1a; 
            background: var(--btn-beige); 
            border-color: var(--btn-beige); 
        }

        .header-phone { 
            color: #fff; 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 14px; 
            letter-spacing: 1px;
            margin-left: 10px;
            transition: color 0.3s ease;
        }

        .header-phone:hover {
            color: var(--btn-beige);
        }

        .page-header { padding: 150px 0 60px; background: #111; color: #fff; text-align: center; }
        .page-header h1 { font-family: 'Playfair Display', serif; font-size: 42px; text-transform: uppercase; margin-bottom: 10px; }
        
        .contacts-section { padding: 80px 0; }
        .contacts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 40px; }
        .contact-card { background: #fafafa; padding: 40px; border-radius: 4px; border: 1px solid #eee; text-align: center; }
        .contact-card i { font-size: 30px; color: var(--btn-beige); margin-bottom: 20px; }
        .contact-card h3 { font-size: 18px; text-transform: uppercase; margin-bottom: 10px; }
        .contact-card p, .contact-card a { color: #666; font-size: 15px; text-decoration: none; }
        .contact-card a:hover { color: var(--btn-beige); }

        footer { background: #111; color: rgba(255,255,255,0.5); padding: 40px 0; text-align: center; font-size: 13px; margin-top: 60px; }

        @media (max-width: 768px) {
            nav { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <div class="header-container">
                <a href="index.html" class="logo-text">INSTROY</a>
                <div class="header-right">
                    <nav>
    <a href="services.html">Услуги</a>
    <a href="anketa.html">Анкета</a>
    <a href="contacts.html">Контакты</a>
</nav>
                    <a href="tel:+79199282678" class="header-phone">8 (919) 928-26-78</a>
                </div>
            </div>
        </div>
    </header>

    <div class="page-header">
        <div class="container">
            <h1>Свяжитесь с нами</h1>
            <p>Мы готовы ответить на любые вопросы и обсудить ваш проект</p>
        </div>
    </div>

    <section class="contacts-section">
        <div class="container">
            <div class="contacts-grid">
                <div class="contact-card">
                    <i class="fa-solid fa-phone"></i>
                    <h3>Телефон</h3>
                    <p><a href="tel:+79199282678">8 (919) 928-26-78</a></p>
                </div>
                <div class="contact-card">
                    <i class="fa-solid fa-envelope"></i>
                    <h3>Email</h3>
                    <p><a href="mailto:info@instroy.ru">info@instroy.ru</a></p>
                </div>
                <div class="contact-card">
                    <i class="fa-solid fa-location-dot"></i>
                    <h3>Офис</h3>
                    <p>г. Тюмень, ул. Ленина, д. 10</p>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 INSTROY. Все права защищены.</p>
        </div>
    </footer>

</body>
</html>
